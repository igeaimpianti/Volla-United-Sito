name: Generate official club PNG assets
on:
  push:
    paths:
      - '.github/workflows/generate-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/generate_brand_assets.py
      - name: Commit official PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/favicon-48.png assets/favicon-192.png assets/favicon-512.png assets/volla-google-logo-1200.png
          git diff --cached --quiet || (git commit -m 'Publish optimized official club PNGs' && git push)
