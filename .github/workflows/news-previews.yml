name: Sincronizza anteprime news
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genera pagine statiche delle notizie pubblicate
        run: node scripts/sync-news-previews.mjs
      - name: Pubblica anteprime aggiornate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notizie/
          if ! git diff --cached --quiet; then
            git commit -m "Sync published news social previews"
            git push
          fi
