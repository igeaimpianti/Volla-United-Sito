name: Ultimi risultati Volla United
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volla-results
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_volla_result.py
      - name: Salva il risultato aggiornato
        run: |
          git diff --quiet -- site-data.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-data.json
          git commit -m 'Aggiorna ultimo risultato Volla United'
          git push
